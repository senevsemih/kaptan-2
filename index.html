<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05080a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>KAPTAN 2: KADİM OKYANUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Oswald:wght@400;500;600;700&family=Special+Elite&display=swap&subset=latin-ext" rel="stylesheet">
<style>:root{--bg:#070b0e;--ink:#e9e3d2;--dim:#9aa59f;--gold:#d9a441;--rust:#b4572e;--teal:#3fb6a8;--red:#c2392f;--panel:rgba(8,13,16,.88);--line:rgba(217,164,65,.35);--head:'Oswald','Arial Narrow',Impact,sans-serif;--body:'Lora',Georgia,'Times New Roman',serif;--type:'Special Elite','Courier New',monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#020405;color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font-family:var(--head);color:var(--ink);cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;justify-content:center;background:radial-gradient(ellipse at center,#0b1418,#010203)}
#game{position:relative;width:100%;max-width:780px;height:100%;overflow:hidden;background:var(--bg);box-shadow:0 0 90px #000}
#game.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-9px,5px)}30%{transform:translate(8px,-6px)}45%{transform:translate(-7px,-4px)}60%{transform:translate(6px,6px)}80%{transform:translate(-3px,2px)}}
#bg,#fx{position:absolute;inset:0;width:100%;height:100%}
#bg{transition:background 1s}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40}
#redv{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(190,20,20,.55));transition:opacity .6s}
#redv.on{opacity:1;animation:pulse 1.2s infinite alternate}
@keyframes pulse{to{opacity:.45}}
#stage{position:absolute;left:0;right:0;top:0;bottom:var(--boxh,220px);display:flex;align-items:center;justify-content:center;z-index:2;padding:56px 10px 6px}
#comic{max-width:100%;max-height:100%;object-fit:contain;border:3px solid #0a0a0a;box-shadow:0 0 0 2px var(--gold),0 12px 40px #000;border-radius:3px;opacity:0;transform:scale(.97);transition:opacity .5s,transform .5s;cursor:zoom-in;background:#000}
#comic.on{opacity:1;transform:none}
#vn{position:absolute;bottom:0;left:50%;width:min(80%,400px);max-height:96%;aspect-ratio:1;transform:translateX(-50%);opacity:0;transition:opacity .35s;pointer-events:none;display:flex;align-items:flex-end;justify-content:center}
#vn.on{opacity:1}
#vn img{width:100%;height:100%;object-fit:cover;border-radius:50% 50% 8px 8px/38% 38% 8px 8px;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent);filter:drop-shadow(0 0 22px var(--vc,#000)) contrast(1.05)}
#vn .big{font-size:120px;filter:drop-shadow(0 0 22px var(--vc,#6cf))}
#zoomb{position:absolute;right:14px;bottom:8px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:15px;display:none}
#zoomb.on{display:block}
#hud{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;padding:max(8px,env(safe-area-inset-top)) 10px 0;pointer-events:none}
#hud>*{pointer-events:auto}
#loc{display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 8px;min-width:128px}
#loc .rn{font:600 12px var(--head);letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
#loc svg{width:116px;height:auto;display:block}
.moral{height:5px;border-radius:3px;background:#222;overflow:hidden}.moral i{display:block;height:100%;width:60%;background:linear-gradient(90deg,#b4572e,#d9a441,#3fb6a8);transition:width .6s}
#loc .ml{font:10px var(--head);letter-spacing:.1em;color:var(--dim);display:flex;justify-content:space-between}
#btns{display:flex;gap:6px}
#btns button,.ib{width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:18px;line-height:1;padding:0}
#btns button:active,.ib:active{background:#222}
#box{position:absolute;left:0;right:0;bottom:0;z-index:10;min-height:var(--boxh,220px);padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(3,6,8,.82) 18%,rgba(3,6,8,.96));display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer}
#np{display:flex;align-items:center;gap:10px;margin-bottom:6px;min-height:46px}
#np.hide{display:none}
#av{width:46px;height:46px;border-radius:50%;border:2px solid var(--vc,var(--gold));background:#111 center/cover;box-shadow:0 0 12px var(--vc,transparent);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
#nm{font:600 20px var(--head);letter-spacing:.1em;color:var(--vc,var(--gold));text-transform:uppercase;text-shadow:0 2px 6px #000}
#nm small{font-size:12px;color:var(--dim);letter-spacing:.08em;margin-left:6px}
#tx{font-size:clamp(16px,2.35vw,19px);line-height:1.5;min-height:3.6em;white-space:pre-wrap;text-shadow:0 1px 4px #000}
#box.n #tx{font-style:italic;color:#d6d0bd;font-size:clamp(16.5px,2.5vw,20px)}
#box.th #tx{font-style:italic;color:#a9d6cf}
#box.th #tx::before{content:'💭 ';font-style:normal}
#nx{align-self:flex-end;color:var(--gold);font-size:18px;opacity:0;animation:blink 1s infinite;height:20px}
#nx.on{opacity:1}
@keyframes blink{50%{transform:translateY(4px);opacity:.4}}
#choices{position:absolute;left:0;right:0;bottom:0;z-index:15;display:none;flex-direction:column;gap:10px;padding:16px 16px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(2,4,6,.94) 30%)}
#choices.on{display:flex}
#choices .q{font:italic 17px var(--body);color:var(--gold);text-align:center;margin-bottom:2px}
.cb{background:linear-gradient(#1a262b,#0f171b);border:1px solid var(--line);border-radius:10px;padding:13px 14px;font:500 17px var(--body);text-align:left;color:var(--ink);transition:.15s}
.cb:hover,.cb:active{border-color:var(--gold);background:linear-gradient(#26373e,#141f24);transform:translateX(3px)}
.ov{position:absolute;inset:0;z-index:50;display:none;background:rgba(2,5,7,.94);flex-direction:column}
.ov.on{display:flex}
.ov h2{font:600 26px var(--head);letter-spacing:.14em;color:var(--gold);margin:0;text-transform:uppercase}
/* title */
#title{z-index:60;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 30%,rgba(10,40,52,.55),rgba(2,4,6,.93))}
#title .logo{font:700 clamp(52px,14vw,96px) var(--head);letter-spacing:.06em;line-height:.95;background:linear-gradient(#f3d58a,#b4572e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #000) drop-shadow(0 0 24px rgba(180,87,46,.5))}
#title .logo span{display:block;font-size:.38em;letter-spacing:.32em;color:var(--teal);-webkit-text-fill-color:var(--teal);filter:none}
#title .tag{font:italic 15px var(--body);color:var(--dim);margin:12px 20px 26px;max-width:420px}
.menu-btn{display:block;width:min(300px,80vw);margin:7px auto;padding:13px;font:500 19px var(--head);letter-spacing:.18em;background:linear-gradient(#1b2a30,#0e171b);border:1px solid var(--line);border-radius:6px;text-transform:uppercase}
.menu-btn:hover,.menu-btn:active{border-color:var(--gold);color:var(--gold)}
.menu-btn.big{background:linear-gradient(#b4572e,#7d3519);border-color:#f3d58a}
.warn{position:absolute;bottom:12px;left:0;right:0;font-size:11px;color:#6d7a76;padding:0 16px}
/* chapter card */
#chap{z-index:55;align-items:center;justify-content:center;text-align:center;cursor:pointer;background:radial-gradient(ellipse,#0d1d24,#020406)}
#chap .cn{font:500 15px var(--head);letter-spacing:.5em;color:var(--teal);opacity:0;animation:fi 1s .2s forwards}
#chap .ct{font:700 clamp(34px,9vw,60px) var(--head);letter-spacing:.08em;color:var(--gold);margin:8px 18px;text-transform:uppercase;opacity:0;animation:fi 1s .6s forwards;text-shadow:0 4px 0 #000}
#chap .cs{font:italic 16px var(--body);color:var(--dim);max-width:430px;margin:0 20px 22px;opacity:0;animation:fi 1s 1.1s forwards}
#chap svg{width:min(320px,80vw);opacity:0;animation:fi 1s 1.5s forwards}
#chap .tp{margin-top:18px;font:13px var(--head);letter-spacing:.3em;color:#58625f;opacity:0;animation:fi 1s 2.2s forwards}
@keyframes fi{to{opacity:1}}
/* card reveal */
#cardov{z-index:58;align-items:center;justify-content:center;cursor:pointer;text-align:center;padding:14px}
#cardov .nw{font:500 14px var(--head);letter-spacing:.4em;color:var(--teal);margin-bottom:10px}
.cardwrap{perspective:900px}
.cardimg{max-height:56vh;max-width:86vw;border-radius:14px;box-shadow:0 0 50px rgba(217,164,65,.45),0 20px 60px #000;animation:flip .9s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{0%{transform:rotateY(90deg) scale(.7);opacity:0}100%{transform:none;opacity:1}}
#cardov .lore{max-width:440px;margin:14px auto 0;font:italic 16px var(--body);color:#cfc8b3;line-height:1.5}
.gcard{width:min(300px,80vw);aspect-ratio:3/4.2;border-radius:14px;border:4px double var(--gold);background:linear-gradient(#17272e,#090f12);padding:10px;display:flex;flex-direction:column;box-shadow:0 0 50px rgba(217,164,65,.35),0 20px 60px #000;animation:flip .9s cubic-bezier(.2,.8,.2,1);text-align:center}
.gcard .gn{font:700 24px var(--head);letter-spacing:.1em;color:var(--gold)}.gcard .gl{font:12px var(--head);letter-spacing:.2em;color:var(--teal)}
.gcard .gp{flex:1;margin:8px 0;border-radius:8px;background:#000 center/cover;display:flex;align-items:center;justify-content:center;font-size:80px;border:1px solid var(--line)}
.gcard .gs{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font:600 14px var(--head);color:#d6d0bd;letter-spacing:.06em}
.gcard .ga{font-size:12px;margin-top:6px;color:#cfc8b3;line-height:1.3}.gcard .ga b{color:var(--gold);font-family:var(--head)}
/* doc */
#docov{z-index:57;align-items:center;justify-content:center;padding:18px;cursor:pointer}
.paper{background:#d8cfae;color:#2a2418;width:min(440px,100%);max-height:84vh;overflow:auto;padding:22px 22px 26px;border-radius:3px;box-shadow:0 18px 60px #000;font-family:var(--type);transform:rotate(-1deg);position:relative;background-image:repeating-linear-gradient(transparent 0 25px,rgba(60,40,10,.12) 25px 26px)}
.paper h3{margin:0 0 12px;font:700 20px var(--head);letter-spacing:.1em;border-bottom:2px solid #2a2418;padding-bottom:6px;text-transform:uppercase}
.paper p{margin:0 0 9px;font-size:14.5px;line-height:1.5}
.paper .stamp{position:absolute;right:14px;top:50px;border:3px solid #a3201a;color:#a3201a;font:700 20px var(--head);padding:2px 8px;transform:rotate(12deg);opacity:.85;letter-spacing:.1em}
/* menu */
#menu{z-index:70;padding:max(12px,env(safe-area-inset-top)) 14px 14px}
#menu .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#menu .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
#menu .tabs button{flex:none;padding:8px 12px;border-radius:16px;background:#0f1a1f;border:1px solid var(--line);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
#menu .tabs button.on{background:var(--gold);color:#000;border-color:var(--gold)}
#mc{flex:1;overflow:auto;padding:6px 2px 20px}
.slot,.chrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0e171b;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:9px}
.slot small,.chrow small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.slot b,.chrow b{font:500 17px var(--head);letter-spacing:.06em}
.sb{padding:8px 12px;border-radius:8px;background:#1b2a30;border:1px solid var(--line);font-size:14px;letter-spacing:.06em}.sb:active{background:var(--gold);color:#000}.sb[disabled]{opacity:.35}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.cth{aspect-ratio:3/4;border-radius:10px;border:1px solid var(--line);background:#0e171b center/cover;display:flex;align-items:flex-end;justify-content:center;font:600 12px var(--head);letter-spacing:.06em;padding:6px;text-align:center;position:relative;overflow:hidden}
.cth span{background:rgba(0,0,0,.72);padding:3px 5px;border-radius:5px;width:100%}
.cth.lock{filter:grayscale(1) brightness(.35);align-items:center;font-size:30px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid #1d2a2f;font-size:16px}
.srow .opts{display:flex;gap:6px}.srow .opts button{padding:7px 12px;background:#101c21;border:1px solid var(--line);border-radius:7px;font-size:14px}.srow .opts button.on{background:var(--gold);color:#000}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.gal img{width:100%;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.roomi{background:#0e171b;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}.roomi b{font:500 16px var(--head);letter-spacing:.08em;color:var(--gold)}.roomi p{margin:4px 0 0;font-size:14px;color:#c9c3af;line-height:1.4}
textarea.code{width:100%;height:90px;background:#050a0c;color:#9fd;border:1px solid var(--line);border-radius:8px;padding:8px;font:11px monospace;user-select:text;-webkit-user-select:text}
/* log */
#log{z-index:70;padding:max(12px,env(safe-area-inset-top)) 16px 16px}
#lg{flex:1;overflow:auto;margin-top:10px}
#lg p{margin:0 0 12px;font-size:15px;line-height:1.45;color:#cfc8b3}#lg b{font:600 14px var(--head);letter-spacing:.1em;display:block;color:var(--gold)}
/* zoom */
#zoom{z-index:80;overflow:auto;padding:0;background:#000}
#zoom img{width:210%;max-width:none;display:block}
#zoomx{position:fixed;top:12px;right:14px;z-index:90}
/* ending */
#endov{z-index:65;align-items:center;justify-content:center;text-align:center;padding:22px;overflow:auto}
#endov h1{font:700 clamp(32px,8vw,54px) var(--head);letter-spacing:.1em;color:var(--gold);margin:6px 0}
#endov .es{font:italic 17px var(--body);color:#cfc8b3;max-width:460px;line-height:1.55;margin:6px auto 14px}
#endov .st{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:10px 0 18px;font:500 15px var(--head);letter-spacing:.08em;color:var(--teal)}
/* toast */
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);z-index:90;background:var(--panel);border:1px solid var(--gold);border-radius:20px;padding:8px 16px;font:500 15px var(--head);letter-spacing:.08em;opacity:0;transition:.4s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
/* mini games */
#mini{z-index:52;padding:max(10px,env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));align-items:center;background:radial-gradient(ellipse at top,#0f2028,#04080a)}
.mwrap{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column}
.mtitle{font:600 22px var(--head);letter-spacing:.14em;color:var(--gold);text-align:center}
.mhint{font:italic 13.5px var(--body);color:var(--dim);text-align:center;margin:2px 6px 8px;min-height:2.6em}
.mbody{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:none}
.mbody *{touch-action:none}
.mbody .cv{width:100%;max-height:100%;aspect-ratio:var(--ar,360/430);border:2px solid var(--line);border-radius:8px;background:#000;touch-action:none}
.mfoot{padding-top:8px;text-align:center}
.mstat{font:500 15px var(--head);letter-spacing:.1em;color:var(--teal);display:block;min-height:1.4em}
.bar{height:8px;border-radius:4px;background:#1c262a;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rust),var(--gold));transition:width .12s}
.mover{position:absolute;inset:0;z-index:5;background:rgba(3,7,9,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;gap:12px}
.mover .big{font:700 32px var(--head);letter-spacing:.1em}.mover p{margin:0;font:italic 15px var(--body);color:#cfc8b3;max-width:340px;line-height:1.45}
.mover .win{color:var(--teal)}.mover .lose{color:var(--red)}
.pbtn{width:min(280px,76vw);padding:14px;font:600 20px var(--head);letter-spacing:.14em;background:linear-gradient(#b4572e,#7d3519);border:1px solid #f3d58a;border-radius:8px;color:#fff}
.pbtn:active{filter:brightness(1.25)}.pbtn.alt{background:linear-gradient(#1b2a30,#0e171b);border-color:var(--line)}
.hold{width:150px;height:150px;border-radius:50%;font:700 18px var(--head);letter-spacing:.08em;background:radial-gradient(#d9a441,#7d3519);border:4px solid #f3d58a;box-shadow:0 0 26px rgba(217,164,65,.4)}
.hold.dn{transform:scale(.93);filter:brightness(1.3)}
/* manifest */
.mfw{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.mfc{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:0;background:#d8cfae;color:#2a2418;border-radius:6px;box-shadow:0 10px 30px #000;font-family:var(--type);touch-action:none;position:relative}
.mfc div{padding:12px 12px 14px;font-size:14px;line-height:1.7}.mfc div+div{border-left:2px dashed #7a6c46;background:#cdbf92}.mfc h4{margin:0 0 4px;font:700 14px var(--head);letter-spacing:.14em;border-bottom:1px solid #2a2418}
.mfb{display:flex;gap:14px;width:100%}.mfb button{flex:1;padding:16px;font:700 20px var(--head);letter-spacing:.12em;border-radius:10px;border:2px solid}
.mfb .no{background:#4a1612;border-color:#c2392f}.mfb .ok{background:#12402f;border-color:#3fb67c}
.mfs{position:absolute;top:8px;left:50%;transform:translateX(-50%) rotate(-8deg);font:700 28px var(--head);padding:2px 12px;border:4px solid;border-radius:6px;opacity:0;letter-spacing:.1em}
/* route */
.grid{display:grid;gap:3px;touch-action:none;width:100%;max-width:340px;margin:auto}
.gc{aspect-ratio:1;border-radius:6px;background:#0f2a36;border:1px solid #1b4656;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,6vw,26px);position:relative;transition:background .12s}
.gc.hz{background:#2a1a1a;border-color:#4a2a2a}.gc.pa{background:#2c7a76;border-color:#6fe}.gc.cur{background:#d9a441;border-color:#fff}
.gc.bad{animation:bad .4s}@keyframes bad{50%{background:#a3201a}}
/* valve */
.vlv{display:flex;gap:24px;align-items:center;justify-content:center;width:100%}
.tube{width:64px;height:300px;max-height:46vh;border:3px solid #6a7a78;border-radius:10px;background:#0a1114;position:relative;overflow:hidden}
.tube .band{position:absolute;left:0;right:0;background:rgba(63,182,127,.35);border-top:2px solid #3fb67c;border-bottom:2px solid #3fb67c}
.tube .lvl{position:absolute;left:0;right:0;height:10px;background:#d9a441;box-shadow:0 0 12px #d9a441;transform:translateY(5px)}
.tube .dg{position:absolute;left:0;right:0;top:0;height:8%;background:rgba(194,57,47,.5)}
/* stealth */
.stl{width:100%;height:100%;max-height:420px;position:relative;background:linear-gradient(#10181c,#070b0d);border:2px solid var(--line);border-radius:8px;overflow:hidden}
.stl .cone{position:absolute;top:30px;left:0;right:0;bottom:0;background:linear-gradient(rgba(255,240,170,.55),rgba(255,240,170,.08));clip-path:polygon(50% 0,100% 100%,0 100%);opacity:0;transition:opacity .15s}
.stl .cone.on{opacity:1}
.stl .tk{position:absolute;width:62px;height:62px;border-radius:50%;background:center/cover;border:3px solid;transform:translateX(-50%)}
.stl .ex{position:absolute;top:2px;left:50%;transform:translateX(-50%);font:700 38px var(--head);color:#f44;opacity:0}
.stl .door{position:absolute;right:6px;bottom:20px;font-size:44px}
.stl .lane{position:absolute;left:0;right:0;bottom:16px;height:3px;background:repeating-linear-gradient(90deg,#445 0 8px,transparent 8px 16px)}
/* simon */
.sim{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(320px,100%)}
.sp{aspect-ratio:1;border-radius:18px;font-size:50px;border:3px solid;display:flex;align-items:center;justify-content:center;opacity:.55;transition:.1s}
.sp.lit{opacity:1;transform:scale(1.06);box-shadow:0 0 30px currentColor}
/* dodge */

.dgt{position:absolute;width:64px;height:64px;border-radius:50%;background:center/cover;border:3px solid;transform:translateX(-50%);transition:left .12s}

.lb{font:12px var(--head);letter-spacing:.12em;color:var(--dim);align-self:flex-start;margin-bottom:-6px}

.cal{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.lcd{font:700 54px 'Courier New',monospace;color:#9fe8b4;background:#04100a;border:3px solid #254a36;border-radius:10px;padding:8px 20px;letter-spacing:.06em;text-shadow:0 0 12px #3fb67c}

.tgb{width:100%;height:30px;border-radius:15px;background:#4a1612;position:relative;overflow:hidden;border:2px solid var(--line)}.tgb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#1c6f66,#3fb6a8)}
.tgf{display:flex;justify-content:space-between;width:100%;align-items:center}.tgf .tk2{width:64px;height:64px;border-radius:50%;background:center/cover;border:3px solid}
.wheel{width:190px;height:190px;border-radius:50%;font-size:96px;background:radial-gradient(#6b4a22,#2a1c0d);border:6px solid var(--gold);box-shadow:0 0 30px rgba(217,164,65,.4),inset 0 0 30px #000;display:flex;align-items:center;justify-content:center;line-height:1}

<script>'use strict';
/* ===== KODLA ÇİZİLEN ÇİZGİ ROMAN SANATI (SVG) ===== */
const INK='#0b0d10';
const svgURI=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
let _uid=0;

/* ---- karakter tanımları (kurgusal) ---- */
const CHR={

  bilalhan:{skin:'#d2a37e',hair:'fade',hc:'#2a1d14',beard:'goatee',bc:'#2a1d14',clothes:'#27303d',collar:'hood',brow:3.6,bags:1,def:'tired',jaw:1},
  rahmi:{skin:'#c99874',hair:'bald',hc:'#2a1d14',beard:'stubble',bc:'#2a1d14',clothes:'#4c86b6',collar:'scrubs',brow:3,def:'smile',steth:1},

  semoidon:{skin:'#bcd7de',hair:'long',hc:'#2e5566',beard:'goatee',bc:'#2e5566',clothes:'#1b3a4a',collar:'toga',brow:3.4,glow:'#7ff6ff',def:'smirk',crown:1},
  cevdet:{skin:'#c9a07c',hair:'grayshort',hc:'#8c8c8c',beard:'none',clothes:'#f0f0ea',collar:'tie',tie:'#202a40',brow:3,cap:1,def:'sad',bags:1},

const EX={
  neutral:{eye:'open',a:0,mouth:'flat'},smile:{eye:'open',a:-2,mouth:'smile'},grin:{eye:'narrow',a:7,mouth:'grin'},angry:{eye:'angry',a:12,mouth:'snarl'},
  sad:{eye:'tired',a:-9,mouth:'frown'},tired:{eye:'tired',a:-3,mouth:'tiredm'},shock:{eye:'wide',a:-12,mouth:'open'},smirk:{eye:'narrow',a:5,mouth:'smirk'},
  flat:{eye:'open',a:5,mouth:'flat'},sleepy:{eye:'closed',a:-2,mouth:'tiredm'}
};
const HEAD=(j)=>j?'M100 28C144 28 156 60 153 100C151 140 134 166 100 168C66 166 49 140 47 100C44 60 56 28 100 28Z':'M100 28C140 28 157 62 152 100C148 140 124 168 100 168C76 168 52 140 48 100C43 62 60 28 100 28Z';

function hairPath(c){
  const f=c.hc;
  switch(c.hair){
    case'messy':return `<path d="M44 108C32 56 66 14 104 16C146 16 170 54 156 108C152 80 146 62 126 56C112 70 88 62 70 70C60 78 54 92 44 108Z" fill="${f}" stroke="${INK}" stroke-width="3"/><path d="M52 60C40 78 40 96 46 118M148 64C160 82 160 100 154 120" stroke="${f}" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M74 28L68 12M100 20L102 4M126 26L136 10" stroke="${f}" stroke-width="7" stroke-linecap="round"/>`;

    case'bald':return `<path d="M49 100C44 78 50 62 60 54C58 72 58 86 62 100Z" fill="${f}" stroke="${INK}" stroke-width="2.5"/><path d="M151 100C156 78 150 62 140 54C142 72 142 86 138 100Z" fill="${f}" stroke="${INK}" stroke-width="2.5"/>`;
    default:return '';
  }
}
function longHairBack(c){return c.hair==='long'?`<path d="M38 100C20 150 24 210 48 236L152 236C176 210 180 150 162 100C160 40 128 16 100 16C72 16 40 40 38 100Z" fill="${c.hc}" stroke="${INK}" stroke-width="3"/>`:''}
function beardPath(c){
  const f=c.bc||c.hc;
  switch(c.beard){
    case'full':return `<path d="M50 104C54 150 78 172 100 172C122 172 146 150 150 104C142 126 128 134 100 134C72 134 58 126 50 104Z" fill="${f}" stroke="${INK}" stroke-width="3"/><path d="M82 126C92 120 108 120 118 126" stroke="${f}" stroke-width="9" fill="none"/>`;
    case'goatee':return `<path d="M82 124C92 118 108 118 118 124C116 120 108 116 100 118C92 116 84 120 82 124Z" fill="${f}"/><path d="M88 152C94 148 106 148 112 152C112 166 106 172 100 172C94 172 88 166 88 152Z" fill="${f}" stroke="${INK}" stroke-width="2"/>`;
    case'stubble':return `<path d="M50 108C54 148 76 168 100 168C124 168 146 148 150 108C140 128 124 136 100 136C76 136 60 128 50 108Z" fill="${f}" fill-opacity=".42"/>`;

  }
}
function eyes(c,ex){
  const L=[78,100],R=[122,100],lid='#0b0d10';
  const bag=(c.bags||ex.eye==='tired')?`<path d="M64 112Q78 120 92 112M108 112Q122 120 136 112" stroke="#000" stroke-opacity=".5" stroke-width="3" fill="none" stroke-linecap="round"/>`:'';
  let e='';
  const pup=(x,y)=>c.glow?`<circle cx="${x}" cy="${y}" r="9" fill="${c.glow}" opacity=".5"/><circle cx="${x}" cy="${y}" r="4.5" fill="${c.glow}"/>`:`<circle cx="${x}" cy="${y}" r="4.2" fill="#14100c"/>`;
  switch(ex.eye){
    case'open':e=[L,R].map(p=>`<ellipse cx="${p[0]}" cy="${p[1]}" rx="10" ry="6.5" fill="#f4f1e8" stroke="${INK}" stroke-width="2.5"/>${pup(p[0]+1,p[1])}`).join('');break;

    case'angry':e=[L,R].map((p,i)=>`<ellipse cx="${p[0]}" cy="${p[1]}" rx="10" ry="5.2" fill="#f4f1e8" stroke="${INK}" stroke-width="2.5"/>${pup(p[0],p[1]+1)}<path d="M${p[0]-12} ${p[1]+(i?-9:-3)}L${p[0]+12} ${p[1]+(i?-3:-9)}L${p[0]+12} ${p[1]-12}L${p[0]-12} ${p[1]-12}Z" fill="${c.skin}" stroke="${INK}" stroke-width="2"/>`).join('');break;
    case'narrow':e=[L,R].map(p=>`<path d="M${p[0]-11} ${p[1]}Q${p[0]} ${p[1]-7} ${p[0]+11} ${p[1]}Q${p[0]} ${p[1]+4} ${p[0]-11} ${p[1]}Z" fill="#f1ede2" stroke="${INK}" stroke-width="2.5"/>${pup(p[0],p[1])}`).join('');break;
    case'wide':e=[L,R].map(p=>`<ellipse cx="${p[0]}" cy="${p[1]}" rx="11" ry="10" fill="#f6f4ec" stroke="${INK}" stroke-width="2.5"/>${c.glow?pup(p[0],p[1]):`<circle cx="${p[0]}" cy="${p[1]}" r="2.8" fill="#14100c"/>`}`).join('');break;
    case'closed':e=[L,R].map(p=>`<path d="M${p[0]-11} ${p[1]}Q${p[0]} ${p[1]+6} ${p[0]+11} ${p[1]}" stroke="${INK}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`).join('');break;

function brows(c,ex){
  const a=ex.a,w=c.brow||3.4,col=c.hair==='bald'||c.hair==='buzz'||c.hair==='grayshort'?(c.hc):c.hc;
  return `<path d="M58 ${86-a*.5}L94 ${86+a}M142 ${86-a*.5}L106 ${86+a}" stroke="${col}" stroke-width="${w+2.6}" stroke-linecap="round"/><path d="M58 ${86-a*.5}L94 ${86+a}M142 ${86-a*.5}L106 ${86+a}" stroke="${INK}" stroke-opacity=".5" stroke-width="1" stroke-linecap="round"/>`;
}
function mouth(c,ex){
  const T=`stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"`;
  switch(ex.mouth){
    case'flat':return `<path d="M84 142L116 142" ${T} fill="none"/>`;
    case'smile':return `<path d="M82 138Q100 154 118 138" ${T} fill="none"/>`;
    case'grin':return `<path d="M76 134Q100 162 124 134Q100 142 76 134Z" fill="#f6f2ea" ${T}/><path d="M84 139L116 139" stroke="${INK}" stroke-width="1.4"/>`;

    case'open':return `<ellipse cx="100" cy="146" rx="9" ry="12" fill="#2a0c0c" ${T}/>`;
    case'smirk':return `<path d="M84 142Q104 146 120 132" ${T} fill="none"/>`;

function clothes(c){
  const col=c.clothes;let d=`<path d="M10 240C14 204 56 182 100 182C144 182 186 204 190 240Z" fill="${col}" stroke="${INK}" stroke-width="3.2"/>`;
  d=`<path d="M86 160L114 160L118 188L82 188Z" fill="${c.skin}" stroke="${INK}" stroke-width="3"/>`+d;
  switch(c.collar){
    case'open':d+=`<path d="M70 184L100 228L130 184L116 180L100 200L84 180Z" fill="${c.skin}" stroke="${INK}" stroke-width="2.5"/><path d="M70 184L60 206M130 184L140 206" stroke="${INK}" stroke-width="2.5"/>`;break;
    case'tie':d+=`<path d="M82 182L100 196L118 182L110 178L100 188L90 178Z" fill="#fff" stroke="${INK}" stroke-width="2.5"/><path d="M96 192L104 192L108 232L100 238L92 232Z" fill="${c.tie}" stroke="${INK}" stroke-width="2"/>`+(c.epaulet?`<rect x="30" y="196" width="26" height="8" fill="#14181f" stroke="${INK}" stroke-width="2"/><rect x="144" y="196" width="26" height="8" fill="#14181f" stroke="${INK}" stroke-width="2"/><path d="M36 196V204M42 196V204M48 196V204M152 196V204M158 196V204M164 196V204" stroke="#e6c35c" stroke-width="2"/>`:'');break;
    case'coat':d+=`<path d="M70 182L100 232L130 182L120 178L100 206L80 178Z" fill="#06080b" stroke="${INK}" stroke-width="2.5"/><path d="M100 206V240" stroke="#c9a23c" stroke-width="3"/><circle cx="92" cy="222" r="3.4" fill="#c9a23c"/><circle cx="108" cy="222" r="3.4" fill="#c9a23c"/><path d="M26 204L58 196M174 204L142 196" stroke="#c9a23c" stroke-width="5"/>`;break;

    case'scrubs':d+=`<path d="M78 182L100 206L122 182L116 178L100 194L84 178Z" fill="#355e86" stroke="${INK}" stroke-width="2.5"/>`;break;
    case'work':d+=`<path d="M78 182L100 200L122 182" fill="none" stroke="${INK}" stroke-width="2.5"/><path d="M60 196H140" stroke="#000" stroke-opacity=".25" stroke-width="3"/>`;break;
    case'toga':d+=`<path d="M10 240C30 200 80 190 100 186C130 192 170 204 190 240Z" fill="#1c4153" stroke="${INK}" stroke-width="3"/><path d="M40 210C80 200 120 200 160 210" stroke="#7ff6ff" stroke-opacity=".6" stroke-width="3" fill="none"/>`;break;
  }
  if(c.steth)d+=`<path d="M78 184C70 214 92 230 100 214C108 230 130 214 122 184" fill="none" stroke="#222" stroke-width="3.4"/><circle cx="100" cy="214" r="6" fill="#999" stroke="${INK}" stroke-width="2"/>`;

function capPath(c){
  if(!c.cap)return '';
  return `<path d="M40 62C40 14 160 14 160 62Z" fill="#0b1220" stroke="${INK}" stroke-width="3"/><path d="M38 56H162V72H38Z" fill="${c.gold?'#1b1b1b':'#0b1220'}" stroke="${INK}" stroke-width="3"/><path d="M38 62H162" stroke="#d7b04a" stroke-width="3.6"/><path d="M48 72Q100 92 152 72L148 80Q100 100 52 80Z" fill="#050709" stroke="${INK}" stroke-width="2.4"/><circle cx="100" cy="40" r="9" fill="#d7b04a" stroke="${INK}" stroke-width="2"/><path d="M100 33V47M94 38H106M95 45Q100 50 105 45" stroke="${INK}" stroke-width="1.8" fill="none"/>`;

function bust(k,e,o){
  o=o||{};const c=CHR[k];if(!c)return '';const ex=EX[e||c.def||'neutral']||EX.neutral;
  const id='h'+(++_uid);
  let s=`<defs><clipPath id="${id}"><path d="${HEAD(c.jaw)}"/></clipPath></defs>`;
  s+=longHairBack(c)+clothes(c);
  s+=`<ellipse cx="48" cy="104" rx="8" ry="14" fill="${c.skin}" stroke="${INK}" stroke-width="3"/><ellipse cx="152" cy="104" rx="8" ry="14" fill="${c.skin}" stroke="${INK}" stroke-width="3"/>`;
  s+=`<path d="${HEAD(c.jaw)}" fill="${c.skin}" stroke="${INK}" stroke-width="3.6"/>`;

  s+=capPath(c);
  if(c.hair==='bald'&&!c.cap)s+=`<path d="M70 52Q100 32 130 52" stroke="#fff" stroke-opacity=".35" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  if(c.glow)s+=`<circle cx="100" cy="100" r="80" fill="${c.glow}" opacity=".07"/>`;
  return s;
}

function fxMarkup(fx,P){

  fx.split(',').forEach(f=>{
    if(f==='rain'){s+='<g stroke="#bcd" stroke-width="1.6" opacity=".45">'+Array.from({length:30},(_,i)=>{const x=(i*37)%400,y=(i*53)%300;return `<path d="M${x} ${y}l-8 22"/>`}).join('')+'</g>'}

    if(f==='teal')s+=`<rect width="400" height="300" fill="#2fe0cc" opacity=".14"/>`;
    if(f==='dark')s+=`<rect width="400" height="300" fill="#000" opacity=".45"/>`;

    if(f==='sepia')s+=`<rect width="400" height="300" fill="#b08040" opacity=".16"/>`;
  });
  return s;
}

function figMarkup(f){
  const x=f.x||200,y=f.y||150,s=f.s||1;
  if(f.prop)return `<g transform="translate(${x} ${y}) rotate(${f.r||0})">${PROP[f.prop](s)}</g>`;

STORY.prolog={title:'PROLOG',name:'Dördüncü',sub:'Argo’nun üç kaptanı gitti. Dördüncüsü telefonu açmak üzere.',room:'kara',icon:'🛋️',bg:'home',nodes:[
CHAP,BG('home'),
N("On yedi yıl. Cengiz Demirkol tam on yedi yıl boyunca farklı gemilerin farklı köprülerinde aynı şeyi yapmıştı: beklemek. Fırtına beklemek, liman beklemek, imza beklemek, maaş beklemek."),
N("Kaptanlık belgesi, çekmecenin dibinde, Portakal’ın mama poşetlerinin altındaydı. Yerini bilirdi ama bakmazdı. Bir insan mesleğini sevmeyi bırakınca ona bakmak bile kâğıt kesiği gibi yakıyordu."),
TH("Pazartesi sabahı pijamayla geçirmek. İnsanlığın en saf hakkı bu amına koyayım."),
N("Portakal, çatlak sesli turuncu bir tekir, sol arka pençesini üç gündür yere basmıyordu. Veteriner dört yüz elli lira muayene, röntgen ayrı demişti. Cüzdanda on bir lira ve bir otobüs kartı vardı."),
IMGN('home',"Telefon çaldı. Rehberdeki kayıt adını Cengiz kendi koymuştu."),
TH("Açmıyorum. Bu numara ulaşılamıyor. Ben emekli sayılırım."),
ASK("Telefon çalıyor...",[
 OPT("Aç. (içinden küfrederek)",[N("Cengiz, hayatının en kötü kararını verdi ve yeşil tuşa bastı.")]),
 OPT("Açma. Yastığın altına göm.",[N("Telefon on bir kez çaldı. Her çalışta Portakal kulağını bir kez oynattı. On ikinci çalışta Cengiz; kadere, doğaya ve veteriner faturasına yenildi.")],{m:-2})]),
S("Cengizciğim! Günaydın aslanım. Uyandırmadım ya seni?",{e:'grin'}),
C("Saat öğlen ikiyi geçiyor Semih. Seni kaç gündür düşünüyordum. İyi şeyler değildi ama."),
S("Ahaha! Kaptanımın mizah anlayışı yerinde. Dinle: Argo’nun kaptanlığı yine boş."),
C("Yine mi? Nurettin ne oldu? Üç ay önce başlamıştı."),
S("Nurettin... Emekli oldu. Kıyıda balık tutuyordur. Hepsi öyle: Cevdet de, Hikmet de. Sağlıklı insanlar gemiyi bırakınca kıyıda balık tutar.",{e:'smirk'}),
TH("Üç kaptan, üç sefer. Üçü de balık. Bu gemi balıkçıları nereden çıkarıyor."),
C("Ben dördüncü olmak istemiyorum Semih. Rakam bile uğursuz."),
S("Dördüncü sayısı şanslıdır. Dört mevsim, dört yön, dört köşe. Hem sen ilk üçüne benzemezsin. Seni özel seçtim Cengiz.",{e:'smile'}),
S("Bir de... Portakal nasıl? Ayağı düzelmiş mi?"),
N("Cengiz’in kanı çekildi. Portakal’ı Semih’e hiç anlatmamıştı. Kimseye anlatmamıştı."),
C("...Sen bunu nereden biliyorsun?"),
S("Ben her şeyi bilirim Cengiz. Veteriner masrafı büyük dert, biliyorum. Avans hazır. Peşin. Üstüne prim.",{e:'grin'}),
TH("Kedimi kullanıyor. Kedimi. Şerefsiz."),
ASK("Cevabın?",[
 OPT("“Tamam lan. Geliyorum. Ama bu SON.”",[S("Her seferinde “son” diyorsun, ben de her seferinde ağlıyorum.")],{m:-4}),
 OPT("“Seni bir gün denize atacağım. Haberin olsun.”",[S("Güzel hedef. Ama deniz beni sever Cengiz. Hepimizi sever. Sonunda.",{e:'smirk'})],{m:4}),
 OPT("“Önce avans. Sonra konuşuruz.”",[S("Pazarlıkçı kaptan! Hesabına bin lira yatırdım bile.")],{set:{avans:true}})]),
S("Liman. Yarım saat. Valiz yok, üniforma var."),
N("Telefon kapandı. Bir süre ikisi de konuşmadı: Cengiz ve Portakal."),
N("Kedi tek gözünü açıp ona baktı. O bakışta “git de dön” yazıyordu. Ya da “mamam bitti” yazıyordu. Kediler belirsizdir."),
TH("Bu sefer dönmem lazım. Dönüp bir daha o gemiye adım atmayacağım. Yemin ediyorum. Yemin ediyorum amına koyayım."),
]};

STORY.ch1={title:'BÖLÜM 1',name:'Sintine Kokusu',sub:'M/V ARGO’ya hoş geldin. Kamaran: sintine.',room:'sintine',bg:'cabin',nodes:[
CHAP,BG('cabin'),
N("M/V ARGO. 1998 yapımı, 187 metre, genel yük gemisi. Armatör: Yılmaz Denizcilik. Boyası sabit, pası dinamik. Pruvadan bakınca tarihten kaçan bir hurda; kıçtan bakınca tarihin kendisi."),
IMGN('dock',"Liman. Akşam. Merdivenin başında biri bekliyordu."),
TH("Argo... Adamın köpeğinin adı da Argo. Her şeyine aynı ismi koyan bir adamdan bir şey çıkmaz."),
N("Güvertede karşılama töreni yoktu. Çünkü Cengiz’in gelişi törene değil, paspasa değerdi."),
S("Kaptan Cengiz’e selam dur!",{e:'grin'}),
S("Hoş geldin Kaptan’ım. Kamaranı ayarladım. Yani sintineyi. Kamara dediğin zaten sintinenin şımarmış hâli.",{e:'smirk'}),
C("Sintine ha. Bir kaptana sintine."),
S("Kâğıt Kaptan’a. Fark var. Zaten gemide bir tek senin imzan geçerli. Gerisi benim işim."),
C("Gemi mürettebatı nerede? 187 metre gemi, güvertede kimse yok."),
S("Asgari emniyet mürettebatı muafiyeti. Beş kişiyiz. Kimseyi görmüyorsan sebebi, hepimiz meşgulüz."),
TH("Beş kişi. Sicilde en az on bir yazar. İmzalı kâğıt, boş gemi. Bu gemi her seferde sigortacıyı kandırıyor."),
N("Sintine kapağı açıldığında, yüzyılların küf kokusu Cengiz’in suratına tokat gibi indi. Aşağıda ne varsa ona anlamsız bir aşkla bakıyordu."),
C("Sikeyim ya... Burası benim cehennemim."),
GAME('scrub',{},2),
N("Zemin parlıyordu. Cengiz’in sırtı kırılmıştı ama yüzeyler parlıyordu. Bir insan için büyük bir zaferdi bu."),
N("Fırçayla kazırken, duvarda bir şeye takıldı. Pasın altında kazınmış harfler: “C.A. 2019”. Altında bir kelime daha: “KAÇ”."),
TH("Cevdet A.? Birinci kaptan... Buraya mı gelmiş? Ne kaçmış?"),
IMGN('sintine',"“Bu temiz mi?”"),
S("CENGİZ! Sintine temiz değil! Ve neden hâlâ çıplaksın lan? Üniformanı giy, kargo manifestosunu kontrol et. Hemen!",{e:'angry'}),
C("Az önce yer sildim amına koyayım."),
S("Silmek temizlik değil, Cengiz. Silmek niyet. Temizlik sonuç."),
N("Duvardaki eski telsiz cızırdadı. Sesin sahibi nezaketle alayı aynı cümleye sığdırabilen biriydi."),
GK("Köprüden Gökhan’a. Kaptan Cengiz göreve başladı. Her şey kontrol altında. İyice terlesin."),
C("Gökhan da kim lan?"),
S("Başmühendis. Geminin kalbi. Onu gören yok."),
C("Neden?"),
S("Gören de anlatamıyor. Gemicilik sırlarından biri."),
N("Cengiz telsize baktı. Telsiz de ona baktı. Birbirlerini sevmediklerini ikisi de biliyordu."),
CARD('cengiz'),
N("Göğsündeki dövme bir an sızladı. Boynuzlu bir maske. “İş güvenliği tedbiri” diye imzalatılan evraktan birinin armağanı. Çıkarmak için lazer değil, mucize lazımdı."),
TH("Isınıyor mu bu... Hayır. Uykusuzluk. Evet. Uykusuzluk."),
CARD('gokhan'),
DOC("KAPTAN’IN DEFTERİ — GÜN 1",["Sintine temizledim. Kıçım ağrıyor. Gökhan’ı hâlâ görmedim.","Duvarda C.A. 2019 yazıyordu. Altında “KAÇ”. Hayır. Ben kaçmam. Ben sadece bir sonraki limanı bekler, sonra kaçarım."]),
]};

STORY.ch2={title:'BÖLÜM 2',name:'Eksik Mürettebat',sub:'Beş kişilik tayfa, beş yüz sayfalık manifesto, tek bir konteyner.',room:'ambar',bg:'cargo',nodes:[
CHAP,BG('cargo'),
N("Üniforma, bir kaptanı giyer. Cengiz’i ise üniforma yemişti. Omuzlar bol, paçalar kısa, rütbe şeritleri ters dikilmiş. Aynadaki adam, kaptan olmaya çalışan bir kuru temizleme torbasıydı."),
S("Harikasın Kaptan! Şimdi ambara in. Manifesto kontrolü. Etiket ile kâğıt uyuşmuyorsa HATA. Uyuşuyorsa TAMAM. Bir ilkokul çocuğu yapar."),
C("Liman denetimi gelirse? Port State Control gelirse? Bu dinlenme saatleriyle, bu mürettebatla?"),
S("Gelmez. Mersin’de Bilalhan, Pire’de dostlar. Her limanın bir Bilalhan’ı vardır Cengiz.",{e:'smirk'}),
GAME('manifest',{},2),
N("Kırk dakika boyunca ton, kod, liman ve “çorap (sol ayak)” okudu. Çorap konteyneri on iki taneydi. Hepsi sol ayak. Hiç sağ ayak yoktu. Bir gün bu evrenin sağ ayağını bulursa bütün gizemler çözülecekti."),
N("Son rafta, bir konteyner ötekilerden uzak duruyordu."),
N("Numarası yoktu. Etiket karalanmıştı. Üstünde tuz bağlamış kuru bir ibare: “KADİM YÜK — AÇILMAZ.”"),
IMGN('cargo',"Konteynerin içinden su sesi geliyordu."),
TH("Yok. Duymuyorum. Konteynerde dalga sesi olmaz. Tonlarca çelik, kuru, kapalı."),
N("Dövmesi ısındı. Bu sefer hayal değildi."),
ASK("Konteynere ne yapacaksın?",[
 OPT("Kulağını yapıştır, dinle.",[N("Çeliğin ardından bir ses geldi. Kadın değil, erkek değil, ses bile değil: ıslak bir fısıltı."),N("“Dümen...” dedi. “Dümen... sende.”"),TH("Ben bir şey duymadım. Ben hiçbir şey duymadım amına koyayım.")],{set:{listened:true},m:-3}),
 OPT("Dokunma. Geri çekil.",[N("Geri çekildi. Çok akıllıca. Ama fısıltı onu geri çekilmesine rağmen takip etti: “dümen... dümen...”")])]),
GK("Köprüden Gökhan’a. Kaptan, ambarda gereksiz oyalanma görünüyor. Terlemeye devam."),
C("Gökhan, bu konteynerin içinde ne var?"),
N("Uzun bir sessizlik. Telsizin cızırtısı bile durdu."),
GK("...Kapat telsizi, Cengiz. Hemen. Burası dinleniyor."),
N("Çıt. Telsiz sustu. Çok garipti. Gökhan hiçbir şey karşısında susmazdı."),
SETF({gokhanSus:true}),
DOC("KAPTAN’IN DEFTERİ — GÜN 3",["Beş yüz sayfa manifesto. Sol ayak çorabı: 12.000 adet. Sağ ayak: sıfır. Evrensel adaletsizlik.","Ambardaki konteyner fısıldadı. Ben delirmedim. Henüz."]),
]};

STORY.ch3={title:'BÖLÜM 3',name:'Köprü Nöbeti',sub:'Sıkıntının anatomisi. Ve gece yarısı birinin duası.',room:'kopru',bg:'bridge',nodes:[
CHAP,BG('bridge'),
N("Gece. Rüzgârsız. Gemi kendi sessizliğinin içinde ilerliyordu."),
N("Köprü nöbeti, gemilerin en şiirsel ve en ölümcül görevidir. Şiirsel, çünkü yıldızlar vardır. Ölümcül, çünkü yıldızlardan başka bir şey yoktur."),
S("Kaptan Cengiz, bu gece vardiya sende. Ben şuraya oturacağım. Radar bende, rota bende. Sen de... köprüde bekleyeceksin."),
C("Peki ne yapacağım?"),
S("Hiçbir şey. Hiçbir şey yapmayı izlemek, hayatın en büyük tadıdır.",{e:'smirk'}),
N("Bir saat. İki saat. Üç. Cengiz saatine baktı: 22.41. Bir buçuk saat önce de 22.40’tı."),
TH("Sıkıntıdan patlayacağım. Zaman durmuş sanki."),
C("Kaptan Semih, başka bir iş yok mu? Biraz hava alsam?"),
S("Hayır."),C("...Peki başka bir şey?"),S("Hayır."),
N("Köprünün zemininde, Cengiz’in aynı daireyi yüzlerce kez yürümesinden ince, solgun bir halka oluşmuştu."),
TH("Bu da iş mi? Hapishaneden beter."),
N("Raftan bir kitap çıktı: “Gemicilik Düğümleri ve Sanat”. Kapağı yağ ve ümitsizlik kokuyordu."),
TH("Belki biraz düğüm çalışırım. Vakit geçer."),
GAME('knot',{},3),
IMGN('knot',"Cengiz, hayatında ilk kez bir şeyi bitirdi."),
S("Cengiz! Ne yapıyorsun? Raporu bitirdin mi?"),
C("Bitti, Kaptan. Ve bak, bu Türk Kafası düğümü!"),
S("...Çok güzel olmuş. Yarın bundan elli tane isterim."),
TH("Elli tane. Sikeyim."),
N("O gece Cengiz, Semih’in yüzüne ilk kez dikkatle baktı. Yanağındaki ince yara izi. Gülüşün tam gözlere varmadığı yer. Bir insanın sevinci değil, bir işin memnuniyetiydi bu."),
CARD('semih'),
BG('storm'),
N("Koltukta dalmıştı. Şimşek çaktı. Gözlerini aralayınca kanı çekildi."),
IMGN('prayer',"Gece Kaptanı. Beyaz üniforma gitmişti; yerine siyah palto, siyah eldiven."),
S("Yüce Semoidon... Kul yine nöbette. Kâğıt Kaptan terliyor. Üzgün. Yorgun. Mutsuz. Tam istediğin gibi.",{e:'grin',p:'semihdark'}),
S("Üç kaptan, yedi yıl. Dördüncü yeter dedin. Dördüncü yeter. Ondan sonra borcum biter.",{e:'sad',p:'semihdark'}),
N("Semoidon. Cengiz bu ismi hiç duymamıştı. Ama göğsündeki mühür, ismi duyunca sıçradı."),
S("Kadim yük ambarda duruyor Efendim. Fısıldıyor. “O”... “O” uyanıyor.",{e:'shock',p:'semihdark'}),
S("Biliyorum. Önce Kâğıt Kaptan’ı kıracağım. Sonra rotayı.",{e:'angry',p:'semihdark'}),
N("Cengiz nefesini tuttu. Semih kapıya döndü. Cengiz gözlerini kapadı, horlama taklidi yaptı. Ömründe ilk kez başarılı bir oyunculuktu."),
TH("Dördüncü yeter. Dördüncü ben miyim? Beni kırmak mı? Üç kaptan kırıldı, ben de kırılırsam... borç biter mi? Kimin borcu?"),
DOC("KAPTAN’IN DEFTERİ — GÜN 6",["Bir düğüm yaptım. Elli tane istiyor. Allah belasını versin.","Gece biri konuşuyordu köprüde: Semih. Adı Semoidon. “Dördüncü yeter” dedi. O ben miyim?"]),
]};

STORY.ch4={title:'BÖLÜM 4',name:'Dinlenme Saati',sub:'STCW diyor ki: günde en az 10 saat dinlenme. Argo diyor ki: ne dinlenmesi?',room:'makine',bg:'bridge',nodes:[
CHAP,BG('bridge'),
N("Uluslararası kurallar, bir gemicinin günde on saat dinlenmesini şart koşar. Argo bu kuralı seyir defterinde bir kez uyguluyordu: defterdeki yalan, kimsenin uyumadığı gerçeğini örtüyordu."),
S("Cengiz, rotadan şaşmışız! Bu gece için yeni bir rota planla ve makine dairesine inip yakıt ikmalini kontrol et."),

/* ===== audio ===== */
const AU={ctx:null,
  init(){if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return}
    try{const c=this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.master=c.createGain();this.master.gain.value=SET.sound?.5:0;this.master.connect(c.destination);
      const len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);let last=0;for(let i=0;i<len;i++){last=(last+.02*(Math.random()*2-1))/1.02;d[i]=last*3.4}
      const s=c.createBufferSource();s.buffer=buf;s.loop=true;this.f=c.createBiquadFilter();this.f.type='lowpass';this.f.frequency.value=380;this.g=c.createGain();this.g.gain.value=.3;s.connect(this.f);this.f.connect(this.g);this.g.connect(this.master);s.start();
      const l=c.createOscillator();l.frequency.value=.11;const lg=c.createGain();lg.gain.value=120;l.connect(lg);lg.connect(this.f.frequency);l.start();
      const o=c.createOscillator();o.type='sawtooth';o.frequency.value=47;const of=c.createBiquadFilter();of.type='lowpass';of.frequency.value=150;this.hum=c.createGain();this.hum.gain.value=0;o.connect(of);of.connect(this.hum);this.hum.connect(this.master);o.start();
    }catch(e){this.ctx=null}},
  mood(m){if(!this.ctx)return;const M=({home:[260,.14,0],ship:[400,.3,.04],engine:[620,.36,.16],storm:[900,.62,.03],void:[220,.4,.02],clinic:[300,.1,0]})[m]||[400,.3,.04];const t=this.ctx.currentTime;this.f.frequency.setTargetAtTime(M[0],t,.8);this.g.gain.setTargetAtTime(M[1],t,.8);this.hum.gain.setTargetAtTime(M[2],t,.8)},
  setVol(){if(this.master)this.master.gain.value=SET.sound?.5:0},
  tone(f,d=.12,type='sine',v=.18,delay=0){if(!this.ctx||!SET.sound)return;const c=this.ctx,t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+.02)},
  noise(d=.5,f=800,v=.4){if(!this.ctx||!SET.sound)return;const c=this.ctx,n=c.sampleRate*d,b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource();s.buffer=b;const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;const g=c.createGain();g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(this.master);s.start()},
  sfx(k){switch(k){case'click':this.tone(520,.06,'square',.08);break;case'ok':this.tone(660,.1,'triangle',.2);this.tone(880,.14,'triangle',.2,.09);break;case'bad':this.tone(150,.28,'sawtooth',.22);break;case'win':[523,659,784,1046].forEach((f,i)=>this.tone(f,.2,'triangle',.22,i*.1));break;case'thunder':this.noise(1.6,500,.9);break;case'hit':this.noise(.25,1200,.7);this.tone(90,.2,'square',.25);break;case'alarm':this.tone(880,.18,'square',.15);this.tone(660,.18,'square',.15,.2);break;case'card':[392,523,659,784,1046].forEach((f,i)=>this.tone(f,.3,'sine',.18,i*.08));break;case'scrub':this.noise(.08,2200,.12);break}}
};

const THEMES={
  home:{a:'#3a2a1c',b:'#0c0806',m:'home',dust:1},cabin:{a:'#1f332b',b:'#060d0a',m:'ship',drip:1},cargo:{a:'#1b1f2a',b:'#05060a',m:'ship',dust:1},
  bridge:{a:'#0f2234',b:'#03070c',m:'ship',radar:1,rain:.25},engine:{a:'#3a0f0c',b:'#0c0303',m:'engine',steam:1,pulse:1},boiler:{a:'#40190a',b:'#0b0402',m:'engine',embers:1},
  storm:{a:'#0f2230',b:'#020508',m:'storm',rain:1,light:1},clinic:{a:'#15303d',b:'#050a0e',m:'clinic',dust:.5},factory:{a:'#38321f',b:'#0b0a06',m:'engine',dust:1,embers:.35},
  harbor:{a:'#4a3228',b:'#0b0f18',m:'ship',dust:.4},void:{a:'#06303a',b:'#01070a',m:'void',bubbles:1},night:{a:'#0a1a28',b:'#020507',m:'ship',rain:.1},dossier:{a:'#2b2418',b:'#080604',m:'clinic',dust:.8}
};
let THM=THEMES.void,parts=[],fxc,fxx,fxT=0,lightT=0;
function setBG(name){THM=THEMES[name]||THEMES.void;$('#bg').style.background=`radial-gradient(ellipse at 50% 20%,${THM.a},${THM.b} 75%)`;AU.mood(THM.m);$('#redv').classList.toggle('on',!!THM.pulse);parts=[];
  const cnt=(THM.rain?90*THM.rain:0)+(THM.embers?40*THM.embers:0)+(THM.bubbles?40:0)+(THM.dust?30*THM.dust:0)+(THM.steam?24:0)+(THM.drip?8:0);
  for(let i=0;i<cnt;i++)parts.push(mkPart(true))}
function mkPart(init){const W=fxc.width,H=fxc.height;const p={x:rnd(0,W),y:init?rnd(0,H):-10,k:'dust'};
  const pool=[];if(THM.rain)pool.push('rain');if(THM.embers)pool.push('ember');if(THM.bubbles)pool.push('bub');if(THM.dust)pool.push('dust');if(THM.steam)pool.push('steam');if(THM.drip)pool.push('drip');
  p.k=pick(pool.length?pool:['dust']);
  if(p.k==='rain'){p.vy=rnd(700,1000);p.vx=-160;p.l=rnd(10,22)}else if(p.k==='ember'){p.y=init?rnd(0,H):H+10;p.vy=-rnd(30,110);p.vx=rnd(-20,20);p.s=rnd(1,3)}
  else if(p.k==='bub'){p.y=init?rnd(0,H):H+10;p.vy=-rnd(20,60);p.vx=rnd(-8,8);p.s=rnd(2,8)}else if(p.k==='steam'){p.y=init?rnd(0,H):H+10;p.vy=-rnd(25,60);p.vx=rnd(-10,10);p.s=rnd(20,50)}
  else if(p.k==='drip'){p.vy=rnd(200,400);p.vx=0;p.s=2}else{p.vy=rnd(3,14);p.vx=rnd(-8,8);p.s=rnd(1,2.5)}return p}
function fxLoop(t){const dt=Math.min(.05,(t-fxT)/1000||.016);fxT=t;const W=fxc.width,H=fxc.height;fxx.clearRect(0,0,W,H);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.k==='rain'){fxx.strokeStyle='rgba(170,200,230,.35)';fxx.lineWidth=1;fxx.beginPath();fxx.moveTo(p.x,p.y);fxx.lineTo(p.x+p.vx*.02,p.y-p.l);fxx.stroke()}
    else if(p.k==='ember'){fxx.fillStyle=`rgba(255,${ri(110,170)},40,.8)`;fxx.fillRect(p.x,p.y,p.s,p.s)}
    else if(p.k==='bub'){fxx.strokeStyle='rgba(150,240,255,.4)';fxx.beginPath();fxx.arc(p.x,p.y,p.s,0,7);fxx.stroke()}
    else if(p.k==='steam'){fxx.fillStyle='rgba(200,200,200,.05)';fxx.beginPath();fxx.arc(p.x,p.y,p.s,0,7);fxx.fill()}
    else if(p.k==='drip'){fxx.fillStyle='rgba(120,200,190,.5)';fxx.fillRect(p.x,p.y,p.s,8)}
    else{fxx.fillStyle='rgba(255,230,190,.28)';fxx.fillRect(p.x,p.y,p.s,p.s)}
    if(p.y>H+20||p.y<-60||p.x<-40||p.x>W+40){Object.assign(p,mkPart(false))}}
  if(THM.radar){const cx=W-56,cy=118,r=38,a=t/900;fxx.strokeStyle='rgba(80,255,150,.25)';fxx.lineWidth=1;fxx.beginPath();fxx.arc(cx,cy,r,0,7);fxx.stroke();fxx.beginPath();fxx.arc(cx,cy,r/2,0,7);fxx.stroke();
    const g=fxx.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,'rgba(80,255,150,.0)');g.addColorStop(1,'rgba(80,255,150,.5)');fxx.fillStyle=g;fxx.beginPath();fxx.moveTo(cx,cy);fxx.arc(cx,cy,r,a,a+.5);fxx.fill()}
  if(THM.light){lightT-=dt;if(lightT<0){lightT=rnd(3,9);flash(.8);AU.sfx('thunder')}}
  requestAnimationFrame(fxLoop)}
function flash(a=.9,ms=450){const f=$('#flash');f.style.transition='none';f.style.opacity=a;requestAnimationFrame(()=>{f.style.transition=`opacity ${ms}ms`;f.style.opacity=0})}

function setSpeaker(who,v,e){const c=CHAR[who];const np=$('#np'),av=$('#av'),nm=$('#nm');
  if(!c){np.classList.add('hide');$('#game').style.setProperty('--vc','#888');return}
  np.classList.remove('hide');$('#game').style.setProperty('--vc',c.c);nm.innerHTML=c.n+(c.s?`<small>${c.s}</small>`:'');
  const pk=v||c.p;if(pk&&PORT[pk]){av.style.backgroundImage=`url(${portrait(pk,e)})`;av.textContent=''}else{av.style.backgroundImage='none';av.textContent=c.e||'?'}}
function showVN(who,v,e){const vn=$('#vn');if(curComic||!who||!CHAR[who]){vn.classList.remove('on');return}
  const c=CHAR[who],pk=v||c.p;vn.innerHTML=(pk&&PORT[pk])?`<img src="${portrait(pk,e)}" alt="">`:`<div class="big">${c.e||'?'}</div>`;vn.classList.add('on')}
function say(who,text,kind,o={}){return new Promise(res=>{
  const box=$('#box'),tx=$('#tx'),nx=$('#nx');box.className=kind;nx.classList.remove('on');
  if(kind==='n'){setSpeaker(null);showVN(null)}else{const w=kind==='th'?'cengiz':who;const ex=o.e||(kind==='th'?'tired':undefined);setSpeaker(w,o.p,ex);showVN(w,o.p,ex);
    if(w==='cengiz'){const m=text.match(SWEAR);if(m)G.curse+=m.length}}
  G.log.push({w:kind==='n'?'':(kind==='th'?'Cengiz (içinden)':CHAR[who]?CHAR[who].n:who),x:text});if(G.log.length>250)G.log.shift();
  tx.textContent='';let i=0;const sp=SPEED[SET.speed];
  const finish=()=>{clearInterval(typing.iv);tx.textContent=text;typing=null;nx.classList.add('on');tapRes=()=>{tapRes=null;res()}};
  typing={finish};
  if(!sp){finish();return}
  typing.iv=setInterval(()=>{i+=1;tx.textContent=text.slice(0,i);if(i>=text.length)finish()},sp);
  updStage();requestAnimationFrame(setBoxH)})}
function advance(){if(ovOpen>0||$('#choices').classList.contains('on'))return;AU.init();if(typing){typing.finish();return}if(tapRes){AU.sfx('click');tapRes()}}

  opts.forEach((o,i)=>{const b=mkEl('button','cb',o.l);b.onclick=()=>{AU.sfx('ok');c.classList.remove('on');choiceRes=null;res(i)};c.appendChild(b)});c.classList.add('on');choiceRes=()=>{c.classList.remove('on');res(-1)}})}

let frames=[];
function abortRun(){runId++;typing&&clearInterval(typing.iv);typing=null;const t=tapRes;tapRes=null;if(choiceRes)choiceRes();if(miniAbort)miniAbort();
  ['chap','cardov','docov'].forEach(i=>{const o=$('#'+i);o.classList.remove('on');o.onclick=null});$('#choices').classList.remove('on');$('#mini').classList.remove('on');$('#endov').classList.remove('on');$('#redv').classList.remove('on');ovOpen=0}
function startRun(){const my=++runId;AU.init();$('#title').classList.remove('on');setComic(null);updHud();play(my)}
function condOK(c){return typeof c==='function'?c():!!G.flags[c]}
async function play(my){
  const cur=()=>STORY[G.ch];
  frames=[{n:cur().nodes,i:G.i}];
  if(G.i===0){setBG(cur().bg||'void')}else{setBG(cur().bg||'void')}
  while(runId===my){
    const f=frames[frames.length-1];
    if(f.i>=f.n.length){
      if(frames.length>1){frames.pop();continue}
      const nx=ORDER[ORDER.indexOf(G.ch)+1];if(!nx)return;
      G.ch=nx;G.i=0;G.maxCh=Math.max(G.maxCh,ORDER.indexOf(nx));frames=[{n:STORY[nx].nodes,i:0}];updHud();autosave();continue}
    const node=f.n[f.i++];
    await exec(node,my);
    if(runId!==my)return;
    if(frames.length===1){G.i=frames[0].i;autosave()}
  }}
async function exec(n,my){
  switch(n.t){
    case'chap':{const ch=STORY[G.ch];if(!G.rooms.includes(ch.room))G.rooms.push(ch.room);G.maxCh=Math.max(G.maxCh,ORDER.indexOf(G.ch));updHud();setComic(null);$('#box').className='n';$('#tx').textContent='';$('#np').classList.add('hide');await chapterCard(ch);break}
    case'bg':setComic(null);setBG(n.b);break;
    case'img':{setComic(n.id);if(n.cap){await say(null,n.cap,'n')}else await waitTap();break}
    case'clr':setComic(null);break;
    case'n':await say(null,n.x,'n');break;
    case'th':await say('cengiz',n.x,'th');break;
    case'd':await say(n.w,n.x,'d',n);break;
    case'ask':{const i=await ask(n.q,n.o);if(runId!==my||i<0)return;const o=n.o[i];if(o.set)Object.assign(G.flags,o.set);if(o.m)setMoral(o.m);if(o.r&&o.r.length)frames.push({n:o.r,i:0});break}
    case'if':{const b=condOK(n.c)?n.a:n.b;if(b&&b.length)frames.push({n:b,i:0});break}
    case'set':if(n.f)Object.assign(G.flags,n.f);if(n.m)setMoral(n.m);break;
    case'fx':if(n.k==='shake')shake();else if(n.k==='flash')flash(.9);else if(n.k==='thunder'){flash(1,900);AU.sfx('thunder');shake()}else if(n.k==='red')$('#redv').classList.toggle('on',n.on!==false);else if(n.k==='hit'){AU.sfx('hit');shake();flash(.4,300)}else if(n.k==='alarm')AU.sfx('alarm');await sleep(n.w||300);break;
    case'wait':await sleep(n.ms);break;
    case'card':await revealCard(n.id);break;
    case'doc':await showDoc(n);break;
    case'game':{delete G.flags['skip_'+n.g];const r=await runMini(n.g,n.o||{},my);if(runId!==my)return;if(r==='skip'){G.flags['skip_'+n.g]=true;setMoral(-3)}else setMoral(n.m||0);break}
    case'end':await showEnding(n.e);break;
  }}

/* ===== mini game host ===== */
const MINI={};
function runMini(id,opts,my){
  const M=MINI[id];let fails=0;
  return new Promise(async res=>{
    const ov=$('#mini');
    for(;;){
      const r=await playOnce(M,ov,opts,fails);
      if(runId!==my){res('abort');return}
      if(r==='abort'){res('abort');return}
      if(r==='win'){ov.classList.remove('on');ovOpen--;res('win');return}
      fails++;
      const c=await resultScreen(ov,r,fails>=2);
      if(runId!==my){res('abort');return}
      if(c==='skip'){ov.classList.remove('on');ovOpen--;res('skip');return}
    }})}
function playOnce(M,ov,opts,fails){
  return new Promise(res=>{
    ov.innerHTML=`<div class="mwrap"><div class="mtitle">${M.title}</div><div class="mhint"></div><div class="mbody"></div><div class="mfoot"><span class="mstat"></span><div class="bar"><i></i></div></div></div>`;
    if(!ov.classList.contains('on')){ov.classList.add('on');ovOpen++}
    const body=$('.mbody',ov),stat=$('.mstat',ov),bar=$('.bar i',ov);
    const intro=mkEl('div','mover',`<div class="big">${M.title}</div><p>${typeof M.how==='function'?M.how(opts):M.how}</p><button class="pbtn" id="mgo">BAŞLA</button>`);body.appendChild(intro);
    let ac=null,raf=0,over=false;
    const finish=(win,msg)=>{if(over)return;over=true;cancelAnimationFrame(raf);ac.abort();miniAbort=null;AU.sfx(win?'win':'bad');vib(win?60:200);
      if(win){const w=mkEl('div','mover',`<div class="big win">✔ BAŞARDIN</div><p>${msg||''}</p>`);body.appendChild(w);setTimeout(()=>res('win'),1100)}else res(msg||'Olmadı.')};
    miniAbort=()=>{if(ac)ac.abort();cancelAnimationFrame(raf);over=true;miniAbort=null;res('abort');ov.classList.remove('on')};
    $('#mgo',ov).onclick=()=>{AU.init();AU.sfx('click');intro.remove();$('.mhint',ov).textContent=typeof M.how==='function'?M.how(opts):M.how;ac=new AbortController();
      const api={sig:ac.signal,done:finish,stat:t=>stat.textContent=t,bar:f=>bar.style.width=(clamp(f,0,1)*100)+'%',on:(el,ev,fn,o)=>el.addEventListener(ev,fn,Object.assign({signal:ac.signal},o||{})),
        loop(fn){let last=performance.now();const tick=t=>{if(over)return;const dt=Math.min(.05,(t-last)/1000);last=t;fn(dt);if(!over)raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)},opts,fails,vib,AU,
        pt(e,el){const r=el.getBoundingClientRect();return[(e.clientX-r.left)*(el.width?el.width/r.width:1),(e.clientY-r.top)*(el.height?el.height/r.height:1)]}};
      M.start(body,api,opts)}})}
function resultScreen(ov,msg,canSkip){return new Promise(res=>{const body=$('.mbody',ov);
  const w=mkEl('div','mover',`<div class="big lose">✖ OLMADI</div><p>${msg}</p><button class="pbtn" id="mr">TEKRAR DENE</button>${canSkip?'<button class="pbtn alt" id="ms">GEÇ (moral −3)</button>':''}`);body.innerHTML='';body.appendChild(w);
  $('#mr',w).onclick=()=>{AU.sfx('click');res('retry')};if(canSkip)$('#ms',w).onclick=()=>res('skip');
  const prev=miniAbort;miniAbort=()=>{res('abort');ov.classList.remove('on')}})}

MINI.route={title:'🧭 ROTA PLANI',how:'Parmağını ⚓’tan başlat, kayalık ve fırtınaya (🪨 ⛈) değmeden 3 feneri (🏮) topla ve 🏁 limana ulaş. Geri çekilirsen yol silinir.',

  const R=9,C=7,g=mkEl('div','grid');g.style.gridTemplateColumns=`repeat(${C},1fr)`;b.appendChild(g);const cells=[];

  const at=(r,c)=>ROUTE[r][c];let path=[[R-1,0]],got=new Set(),down=false;
  function paint(){cells.forEach((e,i)=>{e.classList.remove('pa','cur')});path.forEach(([r,c],i)=>{const e=cells[r*C+c];e.classList.add(i===path.length-1?'cur':'pa')});api.stat(`Fener ${got.size}/3 · Adım ${path.length-1}`);api.bar(got.size/3)}

  function cellAt(e){const r=g.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;if(x<0||y<0||x>=1||y>=1)return null;return[Math.floor(y*R),Math.floor(x*C)]}
  function move(e){if(!down)return;const p=cellAt(e);if(!p)return;const[r,c]=p,[lr,lc]=path[path.length-1];if(r===lr&&c===lc)return;if(Math.abs(r-lr)+Math.abs(c-lc)!==1)return;
    if(path.length>1&&path[path.length-2][0]===r&&path[path.length-2][1]===c){const rm=path.pop();got.delete(rm[0]*C+rm[1]);paint();return}

  api.on(document,'keydown',e=>{if(e.code==='ArrowLeft')key=-1;if(e.code==='ArrowRight')key=1});api.on(document,'keyup',()=>key=0);
  api.loop(dt=>{t+=dt;inv-=dt;sp-=dt;if(key)tx=clamp(tx+key*300*dt,20,W-20);
    const cur=60*Math.sin(t*1.1)+25*Math.sin(t*2.7);x+=((tx-x)*Math.min(1,dt*7))+cur*dt;x=clamp(x,16,W-16);
    if(sp<=0){sp=Math.max(.3,.75-.012*t);const k=t>12&&Math.random()<.35?'tent':Math.random()<.35?'vort':'rock';obs.push({x:rnd(24,W-24),y:-30,k,r:k==='vort'?26:k==='tent'?22:17})}
    obs.forEach(o=>{o.y+=(150+t*5)*dt;if(o.k==='tent')o.x+=Math.sin(t*3+o.y/40)*60*dt});obs=obs.filter(o=>o.y<H+40);
    if(inv<=0)for(const o of obs)if(Math.hypot(o.x-x,o.y-(H-80))<o.r+13){hp--;inv=1.1;shake();AU.sfx('hit');vib(150);if(hp<=0)return api.done(false,'Gemi paramparça. Semoidon kahkaha atıyor.');break}
    const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#04141c');g.addColorStop(1,'#0c2e3c');c.fillStyle=g;c.fillRect(0,0,W,H);
    c.strokeStyle='rgba(150,220,255,.18)';c.lineWidth=2;for(let i=0;i<9;i++){const y=((t*120+i*60)%(H+40))-20;c.beginPath();for(let xx=0;xx<=W;xx+=12)c.lineTo(xx,y+Math.sin(xx/22+t*2+i)*7);c.stroke()}
    c.font='34px serif';c.textAlign='center';obs.forEach(o=>c.fillText(o.k==='rock'?'🪨':o.k==='vort'?'🌀':'🦑',o.x,o.y+12));
    if(inv<=0||Math.floor(inv*10)%2){c.font='46px serif';c.fillText('🚢',x,H-66)}c.font='20px serif';c.fillText('❤'.repeat(hp),W/2,28);
    api.stat(`${Math.max(0,Math.ceil(26-t))} sn · Can ${hp}`);api.bar(t/26);if(t>=26)api.done(true,'Dalga gazabı bir an için kesildi. Ama asıl şey denizin altından geliyor…')})}};

/* ====== 10. DÜMEN ÇEKİŞMESİ ====== */
MINI.tug={title:'☸ DÜMEN ÇEKİŞMESİ',how:'Dümen çarkına SÜREKLİ DOKUN! Semih dümeni Semoidon’a çeviriyor; sen Kadim’e. Çubuğu doldur. Mavi Kadim ışığı belirince hızla dokun: bonus! Dostların güç verir.',
start(b,api){
  const w=mkEl('div','tg');w.innerHTML=`<div class="tgf"><div class="tk2" style="border-color:#d9a441;background-image:url(${PORT.cengiz})"></div><div class="tgb"><i></i></div><div class="tk2" style="border-color:#e0533d;background-image:url(${PORT.semihdark})"></div></div><button class="wheel">☸</button>`;b.appendChild(w);
  const kd=mkEl('button','kd','🌊');b.appendChild(kd);b.style.position='relative';
  const fill=$('.tgb i',w),wheel=$('.wheel',w);let p=38+allies()*5+(G.moral-50)*.08,t=0,kt=0,kOn=0,bon=[7,14,21];
  const pull=()=>(10+t*.6)*(1-allies()*.06)*(G.moral>=70?.9:1);
  const tap=()=>{p+=3.9+allies()*.25;AU.tone(180+p*3,.05,'triangle',.08);vib(8)};
  api.on(wheel,'pointerdown',tap);api.on(document,'keydown',e=>{if(e.code==='Space'&&!e.repeat)tap()});
  api.on(kd,'pointerdown',e=>{e.stopPropagation();p+=14;kd.style.display='none';kOn=0;AU.sfx('ok');flash(.3,200)});
  api.loop(dt=>{t+=dt;p-=pull()*dt;if(bon.length&&t>=bon[0]){bon.shift();kd.style.display='block';kd.style.left=ri(10,70)+'%';kd.style.top=ri(10,40)+'%';kOn=1.4;AU.sfx('alarm')}
    if(kOn>0){kOn-=dt;if(kOn<=0)kd.style.display='none'}
    p=clamp(p,0,100);fill.style.width=p+'%';api.stat(`${Math.max(0,Math.ceil(30-t))} sn`);api.bar(p/100);
    if(p>=100)api.done(true,'Dümen senin! Çark Kadim’in yönüne döndü.');else if(p<=0)api.done(false,'Semih dümeni Semoidon’a çevirdi. Güç yetmedi.');else if(t>=30)api.done(false,'Süre bitti. Dümen kilitli kaldı.')})}};

/* ====== 11. ARGO'YU SAKİNLEŞTİR ====== */
MINI.calm={title:'🐕 ARGO’YU SAKİNLEŞTİR',how:'Parmağınla (fareyle) Argo’nun üzerinde YAVAŞ ve düzenli sürt. Çok hızlı olursa hırlar, hiç dokunmazsan sinirlenir. Sakinlik çubuğunu doldur.',
start(b,api){
  const w=mkEl('div','calm');w.innerHTML=`<div class="dogbox" style="background-image:url(${PORT.argo})"></div><div class="lb">SAKİNLİK</div><div class="meter"><i style="background:#3fb6a8"></i></div><div class="lb">ÖFKE</div><div class="meter"><i style="background:#c2392f"></i></div><div class="lb">HIZ — yeşil bandı hedefle</div><div class="meter zone"><i style="background:#d9a441"></i></div>`;b.appendChild(w);
  const box=$('.dogbox',w),[mp,ma,mv]=$$('.meter i',w);let down=false,lx=0,ly=0,lt=0,v=0,pr=0,ag=.15,t=0;
  api.on(box,'pointerdown',e=>{down=true;box.setPointerCapture(e.pointerId);lx=e.clientX;ly=e.clientY;lt=performance.now()});api.on(box,'pointerup',()=>down=false);api.on(box,'pointercancel',()=>down=false);
  api.on(box,'pointermove',e=>{if(!down)return;const n=performance.now(),d=Math.hypot(e.clientX-lx,e.clientY-ly),dt=Math.max(8,n-lt)/1000;v+=((d/dt)-v)*.35;lx=e.clientX;ly=e.clientY;lt=n});
  api.loop(dt=>{t+=dt;if(!down)v*=Math.max(0,1-dt*6);else v*=Math.max(0,1-dt*1.5);
    let st='idle';if(down&&v>=70&&v<=300){pr+=dt*.12;ag=Math.max(0,ag-dt*.06);st='good'}else if(down&&v>380){ag+=dt*.55;st='fast'}else if(!down)ag+=dt*.08;
    box.style.transform=`translate(${Math.sin(t*40)*ag*5}px,0)`;box.style.borderColor=st==='fast'?'#c2392f':st==='good'?'#3fb67c':'#3a5560';
    mp.style.width=pr*100+'%';ma.style.width=Math.min(100,ag*100)+'%';mv.style.width=Math.min(100,v/500*100)+'%';api.stat(st==='fast'?'HIRRR! Yavaş!':st==='good'?'Aferin…':'Sürt, yavaşça');api.bar(pr);
    if(ag>=1)api.done(false,'Argo ısırdı! Rahmi’nin eli kanıyor.');else if(pr>=1)api.done(true,'Argo uykuya daldı. Kalbi yavaşladı.')})}};

/* ====== 12. HASSAS ÖLÇÜ ====== */
MINI.measure={title:'📏 HASSAS ÖLÇÜ',how:o=>o.secret?'Bu kez şartnameye UYMA. Ahmet’in gizli notundaki değere ayarla: 42.53 mm.':'Kumpası hedef değere (±0.02 mm) ayarla. Çubuğu sürükle, ince ayar için +/- kullan. 2 tur.',
start(b,api,o){
  const targets=o.secret?[42.53]:[41.27,43.82];let rd=0;const w=mkEl('div','cal');
  w.innerHTML=`<div class="mhint" id="tgt" style="font-size:16px;color:var(--gold)"></div><div class="lcd" id="rd">42.00</div><input type="range" min="40" max="45" step="0.01" value="42.00"><div class="fine"><button data-d="-0.1">−0.1</button><button data-d="-0.01">−0.01</button><button data-d="0.01">+0.01</button><button data-d="0.1">+0.1</button></div><button class="pbtn">KİLİTLE</button>`;b.appendChild(w);
  const inp=$('input',w),lcd=$('#rd',w),tg=$('#tgt',w);const upd=()=>lcd.textContent=(+inp.value).toFixed(2);
  const lab=()=>{tg.innerHTML=o.secret?`ŞARTNAME: 42.35 mm &nbsp;<s style="color:#888">(Semih)</s><br>AHMET’İN NOTU: <b>42.53</b>`:`HEDEF ÖLÇÜ: <b>${targets[rd].toFixed(2)} mm</b> — Tur ${rd+1}/${targets.length}`;api.stat(`Tur ${rd+1}/${targets.length}`);api.bar(rd/targets.length)};
  inp.oninput=upd;$$('.fine button',w).forEach(bt=>bt.onclick=()=>{inp.value=(+inp.value+ +bt.dataset.d).toFixed(2);upd();AU.sfx('click')});
  $('.pbtn',w).onclick=()=>{const d=Math.abs(+inp.value-targets[rd]);if(d<=.0205){AU.sfx('ok');rd++;if(rd>=targets.length)return api.done(true,'Ölçü kilitlendi. Kumpas ışığı yeşil.');inp.value=(42+Math.random()).toFixed(2);upd();lab()}else api.done(false,`Ölçü ${d.toFixed(2)} mm sapmış. Milimetre bile affetmez.`)};
  lab()}};

/* ====== 13. TELSİZ FREKANSI ====== */
MINI.radio={title:'📻 TELSİZ',how:'Kaydırıcıyla frekansı ayarla: parazit azalınca sinyale yaklaşırsın. Sinyali 1 sn boyunca stabil tut (Semoidon parazit yapıyor, frekans kayıyor). 3 istasyon, 80 sn.',
start(b,api){
  const names=['LİMAN HATTI (Bilalhan?)','KIYI DÜKKÂNI (???)','MAKİNE HATTI (Gökhan)'];let st=0,tf=ri(890,1050)/10,t=0,hold=0,f=98;
  const w=mkEl('div','rad');w.innerHTML=`<div class="mhint" id="nm" style="color:var(--gold);font-size:15px"></div><canvas width="320" height="90"></canvas><div class="lcd" id="fq" style="font-size:42px">98.0</div><input type="range" min="880" max="1080" step="1" value="980"><div class="fine"><button data-d="-1">−0.1</button><button data-d="1">+0.1</button></div>`;b.appendChild(w);
  const cv=$('canvas',w),c=cv.getContext('2d'),inp=$('input',w),fq=$('#fq',w);const nm=()=>$('#nm',w).textContent='ARANAN: '+names[st];nm();
  inp.oninput=()=>f=+inp.value/10;$$('.fine button',w).forEach(bt=>bt.onclick=()=>{inp.value=+inp.value+ +bt.dataset.d;f=+inp.value/10});
  api.loop(dt=>{t+=dt;tf+=Math.sin(t*1.3)*.05*dt*5;tf=clamp(tf,89,107);fq.textContent=f.toFixed(1);const d=Math.abs(f-tf),sig=clamp(1-d/4,0,1);
    c.fillStyle='#021008';c.fillRect(0,0,320,90);c.strokeStyle=`rgba(90,255,150,${.4+sig*.6})`;c.lineWidth=2;c.beginPath();for(let x=0;x<320;x+=3){const n=(Math.random()*2-1)*(1-sig)*38,s=Math.sin(x/9+t*12)*sig*30;c.lineTo(x,45+n+s)}c.stroke();
    if(d<.25){hold+=dt;if(hold>=1){st++;hold=0;AU.sfx('ok');if(st>=3)return api.done(true,'Üç hat da açık. Telsiz artık senin kulağın.');tf=ri(890,1050)/10;nm()}}else hold=Math.max(0,hold-dt*2);
    api.stat(`Sinyal %${Math.round(sig*100)}${d<.25?' — KİLİTLENİYOR':''}`);api.bar((st+hold)/3);if(t>=80)api.done(false,'Süre doldu. Parazit kazandı.')})}};

</script>
